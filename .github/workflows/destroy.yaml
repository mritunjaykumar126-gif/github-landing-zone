name: Terraform Destroy

on:
  workflow_dispatch:

jobs:
  terraform-destroy:
    runs-on: [self-hosted, windows, x64]

    defaults:
      run:
        working-directory: environment/QA

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Terraform Version
        run: terraform --version

      - name: Terraform Init
        run: terraform init

      - name: Import Resource Group
        run: terraform import 'module.resource-group.azurerm_resource_group.rgs["rg1"]' '/subscriptions/f4cd1db7-8147-4c33-8320-3075bfe9c0b6/resourceGroups/test-rg126'

      - name: Import Storage Account
        run: terraform import 'module.storage-account.azurerm_storage_account.strg["strg1"]' '/subscriptions/f4cd1db7-8147-4c33-8320-3075bfe9c0b6/resourceGroups/test-rg126/providers/Microsoft.Storage/storageAccounts/teststrg126'

      - name: Terraform Destroy
        run: terraform destroy -auto-approve